<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120F17">
<title>ALI-A // 1 OF 1 - 21st Birthday Edition</title>
<style>
html,body{margin:0;height:100%;background:#120F17;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:"Courier New",Courier,monospace}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block;
  box-shadow:0 0 40px rgba(201,42,66,.35),0 0 0 2px #262030;background:#120F17}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  pointer-events:none;z-index:5;padding:0 max(12px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
body.touch[data-state="play"] #touch{display:flex}
.grp{display:flex;gap:10px}
.tb{pointer-events:auto;touch-action:none;width:clamp(58px,15vmin,86px);height:clamp(58px,15vmin,86px);border-radius:16px;
  background:rgba(38,32,48,.55);border:2px solid rgba(247,168,196,.8);color:#F7A8C4;font:bold 12px "Courier New",monospace;
  display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 0 12px rgba(247,168,196,.25);letter-spacing:1px}
.tb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(18,15,23,.78) var(--cd,0%),transparent var(--cd,0%));pointer-events:none}
.tb.on{background:rgba(201,42,66,.65);color:#fff}
.tb.jump{border-color:#C92A42;color:#fff}
.tb.flash{border-color:#E2E8F0}
</style>
</head>
<body data-state="title">
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<audio id="alia-theme" src="./ali-a-theme.mp3" preload="auto" loop></audio>
<div id="touch">
  <div class="grp"><div class="tb" data-k="left">&#9664;<br>LEFT</div><div class="tb" data-k="right">RIGHT<br>&#9654;</div></div>
  <div class="grp"><div class="tb flash" id="flashBtn" data-k="flash">FLASH</div><div class="tb jump" data-k="jump">JUMP</div></div>
</div>
<script>
(() => {
'use strict';
const W = 480, H = 270;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

const COL = { bg:'#120F17', plat:'#262030', pink:'#F7A8C4', crim:'#C92A42', chrome:'#E2E8F0', red:'#FF3B30' };
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rnd = (a,b) => a+Math.random()*(b-a);
const approach = (a,b,d) => a<b ? Math.min(a+d,b) : Math.max(a-d,b);
const R = Math.round;
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- resize ---------- */
function resize(){
  const s = Math.min(innerWidth/W, innerHeight/H);
  cv.style.width = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize', resize); resize();

/* ---------- sprites ---------- */
function makeSprite(rows, pal, scale){
  scale = scale||1;
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w*scale; c.height = h*scale;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch = rows[y][x];
    if(ch && ch!=='.' && pal[ch]){ g.fillStyle = pal[ch]; g.fillRect(x*scale,y*scale,scale,scale); }
  }
  return c;
}
const PPAL = { h:'#4a3862', H:'#7a6396', s:'#F9D8CB', e:'#120F17', p:'#F7A8C4', k:'#2a2036', r:'#C92A42' };
const PBASE = [
 '....hhhhhh....',
 '...hhHHHhhh...',
 '..hhhhhhhhhh..',
 '..hhsssssshh..',
 '..hhsesseshh..',
 '..hhspsspshh..',
 '..hhhsrrshhh..',
 '.hhhkkkkkkhhh.',
 '.hhkkrkkrkkhh.',
 '.hhkkkkkkkkhh.',
 '.hhkkpkkpkkhh.',
 '..hkkkkkkkkh..',
 '..hrrrrrrrrh..',
 '...kkkkkkkk...',
 '..kkkkkkkkkk..',
 '..rkkkkkkkkr..'
];
const LEGS = {
 idle:['....ss..ss....','....ss..ss....','....kk..kk....','...kkk..kkk...'],
 run1:['...ss....ss...','..ss.....ss...','..kk.....kk...','.kkk.....kkk..'],
 run2:['.....ssss.....','.....ssss.....','.....kkkk.....','....kkkkkk....']
};
const pSprites = {}; for(const k in LEGS) pSprites[k] = makeSprite(PBASE.concat(LEGS[k]), PPAL);

const BPAL = { p:'#F7A8C4', P:'#D46C93', k:'#120F17' };
const batA = makeSprite(['...p....p...','...pp..pp...','....pppp....','...pppppp...','...pkppkp...','PP.pppppp.PP','PPP.pppp.PPP','.PP..pp..PP.'], BPAL);
const batB = makeSprite(['P..p....p..P','PP.pp..pp.PP','PP..pppp..PP','.P.pppppp.P.','...pkppkp...','....pppp....','....pppp....','.....pp.....'], BPAL);

const plushS = makeSprite(['..pp..pp..','.pppppppp.','.pkppppkp.','WppppppppW','WWppppppWW','..WppppW..','...pppp...','...p..p...'], { p:'#F7A8C4', k:'#120F17', W:'#FFE3EE' });
const roseS = makeSprite(['..rrrrr..','.rRrrrRr.','.rrRrRrr.','..rrRrr..','...rrr...','....g....','..g.g....','...gg....','....g....','....g....'], { r:'#C92A42', R:'#8E1A2E', g:'#2f8a5a' });
const heartS = makeSprite(['.ssss.ssss.','swwsssssssd','swsssssssdd','ssssssssddd','.sssssssdd.','..sssssdd..','...sssdd...','....sd.....'], { s:'#E2E8F0', w:'#FFFFFF', d:'#94A3B8' });
const hudHeart = makeSprite(['.rrr.rrr.','rwrrrrrrr','rrrrrrrrr','rrrrrrrrr','.rrrrrrr.','..rrrrr..','...rrr...','....r....'], { r:'#E23550', w:'#F7A8C4' }, 2);
const hudHeartE = makeSprite(['.rrr.rrr.','rrrrrrrrr','rrrrrrrrr','rrrrrrrrr','.rrrrrrr.','..rrrrr..','...rrr...','....r....'], { r:'#3a2f45' }, 2);
const orbS = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 12; const g = c.getContext('2d');
  for(let y=0;y<12;y++) for(let x=0;x<12;x++){
    const d = Math.hypot(x-5.5,y-5.5);
    if(d>5.8) continue;
    g.fillStyle = d>4.5 ? '#F7A8C4' : ((x+y)<11 ? '#E87AA2' : '#0d0a12');
    if(x===3&&y===3 || x===4&&y===3 || x===3&&y===4) g.fillStyle = '#fff';
    g.fillRect(x,y,1,1);
  }
  return c;
})();
const cubeS = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 14; const g = c.getContext('2d');
  g.fillStyle='#8e1a2e'; g.fillRect(0,0,14,14); g.fillStyle=COL.red; g.fillRect(1,1,12,12);
  g.fillStyle='#ff7a70'; g.fillRect(1,1,12,2); g.fillStyle='#8e1a2e';
  for(let y=4;y<13;y+=3) g.fillRect(2,y,10,1);
  g.fillStyle='#fff'; g.fillRect(6,3,2,6); g.fillRect(6,10,2,2);
  return c;
})();
const spikeS = (() => {
  const c = document.createElement('canvas'); c.width = 8; c.height = 12; const g = c.getContext('2d');
  for(let y=0;y<12;y++){
    const w = Math.max(2, Math.round((y+1)*8/12)), x = Math.floor((8-w)/2);
    g.fillStyle = COL.red; g.fillRect(x,y,w,1);
    g.fillStyle = '#8e1a2e'; g.fillRect(x,y,1,1);
  }
  return c;
})();

/* ---------- particles ---------- */
let parts = [];
function burst(x,y,n,cols,sp,life,grav){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = rnd(sp*.3,sp);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*.5,life),max:life,col:cols[(Math.random()*cols.length)|0],sz:Math.random()<.3?2:1,g:grav||0,conf:false});
  }
}
function confetti(n,x0,x1,y){
  const cols = [COL.pink,COL.crim,COL.chrome,'#ffd3e2'];
  for(let i=0;i<n;i++) parts.push({x:rnd(x0,x1),y:y+rnd(-10,0),vx:rnd(-20,20),vy:rnd(20,80),life:rnd(3,6),max:6,col:cols[(Math.random()*4)|0],sz:2+((Math.random()*2)|0),g:12,conf:true,ph:Math.random()*6});
}
function updateParts(dt,t){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    if(p.life<=0 || p.y>H+20){ parts.splice(i,1); continue; }
    p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.conf){ p.x += Math.sin(p.ph+t*5)*0.5; if(p.vy>60) p.vy=60; }
  }
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha = clamp(p.life/Math.min(p.max,1),0,1);
    ctx.fillStyle = p.col;
    ctx.fillRect(R(p.x),R(p.y),p.sz,p.conf?1+((p.ph*3+p.life*4)|0)%3:p.sz);
  }
  ctx.globalAlpha = 1;
}

/* ---------- audio ---------- */
const A = { ctx:null, master:null, mus:null, sfxBus:null, muted:false, mode:'off', step:0, nextT:0, noise:null, bIdx:0 };
const mtof = m => 440*Math.pow(2,(m-69)/12);
const STEP = 60/132/4;
const CH = [
  {b:45,a:[57,60,64]},{b:41,a:[53,57,60]},{b:48,a:[60,64,67]},{b:43,a:[55,59,62]}
];
const LEAD = [
  [76,0,79,0,81,0,79,0,76,0,0,0,72,0,74,0],
  [77,0,81,0,84,0,81,0,77,0,0,0,76,0,74,0],
  [79,0,84,0,88,0,84,0,79,0,0,0,76,0,72,0],
  [79,0,83,0,86,0,83,0,79,0,74,0,71,0,74,0]
];
const BDAY = [];
(function(){
  const bars = [
    [[67,.75],[67,.25],[69,1],[67,1]],[[72,1],[71,2]],
    [[67,.75],[67,.25],[69,1],[67,1]],[[74,1],[72,2]],
    [[67,.75],[67,.25],[79,1],[76,1]],[[72,1],[71,1],[69,1]],
    [[77,.75],[77,.25],[76,1],[72,1]],[[74,1],[72,2]]
  ];
  const bass = [48,48,43,43,48,41,48,43];
  bars.forEach((b,i)=>b.forEach((n,j)=>BDAY.push({m:n[0],d:n[1],bass:j===0?bass[i]:0})));
})();
/* ---------- finale theme (HTML5 audio, falls back to synth melody) ---------- */
const theme = document.getElementById('alia-theme');
let themeOn = false, themeUnlocked = false;
function themeUnlock(){
  // First user gesture: briefly play muted so mobile browsers allow later playback without delay.
  if(themeUnlocked || !theme) return;
  themeUnlocked = true;
  try{
    theme.muted = true;
    const p = theme.play();
    if(p && p.then) p.then(() => { if(!themeOn){ theme.pause(); theme.currentTime = 0; theme.muted = A.muted; } }).catch(() => { theme.muted = A.muted; });
  }catch(e){}
}
function stopTheme(){
  themeOn = false;
  if(!theme) return;
  try{ theme.pause(); theme.currentTime = 0; }catch(e){}
}
function themeFallback(){
  // Theme failed to load/play: use the Web Audio birthday melody so the finale is never silent.
  if(!themeOn) return;
  themeOn = false;
  if(S==='cake' && cake.lit) setMode('bday');
}
function playTheme(){
  if(!theme){ return false; }
  themeOn = true;
  try{
    theme.loop = true; theme.muted = A.muted; theme.currentTime = 0;
    if(theme.error || theme.networkState===3){ themeFallback(); return false; }
    const p = theme.play();
    if(p && p.catch) p.catch(themeFallback);
    return true;
  }catch(e){ themeFallback(); return false; }
}
if(theme) theme.addEventListener('error', themeFallback);

function audioInit(){
  themeUnlock();
  if(A.ctx){ if(A.ctx.state==='suspended') A.ctx.resume(); return; }
  try{
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    A.ctx = new AC();
    A.master = A.ctx.createGain(); A.master.gain.value = A.muted?0:0.6;
    const comp = A.ctx.createDynamicsCompressor();
    A.master.connect(comp); comp.connect(A.ctx.destination);
    A.mus = A.ctx.createGain(); A.mus.gain.value = .55; A.mus.connect(A.master);
    A.sfxBus = A.ctx.createGain(); A.sfxBus.gain.value = .9; A.sfxBus.connect(A.master);
    const len = A.ctx.sampleRate; A.noise = A.ctx.createBuffer(1,len,A.ctx.sampleRate);
    const d = A.noise.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    setInterval(sched,25);
    if(A.ctx.state==='suspended') A.ctx.resume();
  }catch(e){}
}
function setMute(m){ A.muted = m; if(A.master) A.master.gain.value = m?0:0.6; if(theme) theme.muted = m; }
function note(f,t,dur,type,vol,dest){
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||A.mus); o.start(t); o.stop(t+dur+0.03);
}
function sweep(f0,f1,t,dur,type,vol,dest){
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||A.sfxBus); o.start(t); o.stop(t+dur+0.03);
}
function noiseHit(t,dur,vol,hp,dest){
  const s = A.ctx.createBufferSource(); s.buffer = A.noise;
  const f = A.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
  const g = A.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest||A.sfxBus); s.start(t,Math.random()*0.5); s.stop(t+dur+0.02);
}
function setMode(m){ A.mode = m; A.step = 0; A.nextT = 0; A.bIdx = 0; }
function sched(){
  if(!A.ctx || A.mode==='off' || A.ctx.state!=='running') return;
  const now = A.ctx.currentTime;
  if(A.nextT < now) A.nextT = now+0.05;
  while(A.nextT < now+0.15){
    if(A.mode==='bday'){
      const beat = 60/118, ev = BDAY[A.bIdx];
      const t = A.nextT;
      note(mtof(ev.m),t,ev.d*beat*.95,'square',.09);
      note(mtof(ev.m+12),t,ev.d*beat*.8,'triangle',.06);
      if(ev.bass){ note(mtof(ev.bass),t,beat*1.4,'triangle',.2); note(mtof(ev.bass+12),t+beat,beat*.8,'triangle',.1); note(mtof(ev.bass+7),t+2*beat,beat*.8,'triangle',.1); }
      A.nextT += ev.d*beat; A.bIdx++;
      if(A.bIdx>=BDAY.length){ A.bIdx = 0; A.nextT += beat*2; }
    } else {
      playStep(A.nextT); A.nextT += STEP;
    }
  }
}
function playStep(t){
  const s = A.step%64, bar = s>>4, i = s&15, ch = CH[bar], cozy = A.mode==='cozy';
  if(i%2===0) note(mtof(ch.b+(i%4===2?12:0)),t,STEP*1.8,'triangle',cozy?.12:.22);
  note(mtof(ch.a[[0,1,2,1][i%4]]+12),t,STEP*.9,'square',cozy?.02:.035);
  if(!cozy){
    const l = LEAD[bar][i]; if(l) note(mtof(l),t,STEP*1.7,'square',.06);
    if(i%4===0) sweep(150,40,t,.12,'sine',.5,A.mus);
    if(i===4||i===12) noiseHit(t,.1,.14,1500,A.mus);
    if(i%2===1) noiseHit(t,.03,.05,7000,A.mus);
  }
  A.step++;
}
const sfx = {
  jump(){ if(!A.ctx) return; sweep(220,520,A.ctx.currentTime,.12,'square',.12); },
  djump(){ if(!A.ctx) return; const t=A.ctx.currentTime; sweep(400,900,t,.16,'triangle',.18); noiseHit(t,.08,.05,4000); },
  collect(){ if(!A.ctx) return; const t=A.ctx.currentTime; note(880,t,.1,'square',.1,A.sfxBus); note(1320,t+.07,.14,'square',.1,A.sfxBus); },
  orb(){ if(!A.ctx) return; const t=A.ctx.currentTime; [659,784,988,1319].forEach((f,i)=>note(f,t+i*.06,.14,'square',.1,A.sfxBus)); },
  flash(){ if(!A.ctx) return; const t=A.ctx.currentTime; sweep(300,1400,t,.45,'sawtooth',.1); noiseHit(t,.3,.06,3000); },
  stun(){ if(!A.ctx) return; const t=A.ctx.currentTime; noiseHit(t,.2,.2,1200); sweep(700,90,t,.22,'sawtooth',.12); },
  hurt(){ if(!A.ctx) return; sweep(320,70,A.ctx.currentTime,.28,'square',.16); },
  warn(){ if(!A.ctx) return; const t=A.ctx.currentTime; for(let i=0;i<3;i++) note(i%2?660:990,t+i*.16,.12,'square',.1,A.sfxBus); },
  tele(){ if(!A.ctx) return; const t=A.ctx.currentTime; sweep(900,150,t,.25,'triangle',.15); noiseHit(t,.15,.08,2500); },
  check(){ if(!A.ctx) return; const t=A.ctx.currentTime; [523,659,784].forEach((f,i)=>note(f,t+i*.07,.12,'triangle',.14,A.sfxBus)); },
  click(){ if(!A.ctx) return; note(700,A.ctx.currentTime,.05,'square',.08,A.sfxBus); },
  deny(){ if(!A.ctx) return; note(120,A.ctx.currentTime,.1,'square',.08,A.sfxBus); },
  win(){ if(!A.ctx) return; const t=A.ctx.currentTime; [523,659,784,1047,1319].forEach((f,i)=>note(f,t+i*.09,.25,'square',.1,A.sfxBus)); },
  respawn(){ if(!A.ctx) return; sweep(150,600,A.ctx.currentTime,.3,'triangle',.14); }
};

/* ---------- input ---------- */
const keys = {};
const vk = { left:false, right:false, jump:false, flash:false };
let jumpBuf = 0, flashQ = false, jumpHeld = false;
const KEYMAP = { a:'left', arrowleft:'left', d:'right', arrowright:'right', w:'jump', arrowup:'jump', ' ':'jump', e:'flash', shift:'flash', enter:'flash' };
addEventListener('keydown', e => {
  audioInit();
  const k = e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k)) e.preventDefault();
  if(e.repeat) return;
  if(k==='m'){ setMute(!A.muted); return; }
  keys[k] = true;
  if(S==='title'){ if(k==='enter'||k===' ') startGame(); return; }
  if(S==='intro'){ if(k==='enter'||k===' '||k==='e'){ introDone(); } return; }
  if(S==='play'){
    if(KEYMAP[k]==='jump'){ jumpBuf = .12; }
    if(KEYMAP[k]==='flash') flashQ = true;
  }
  if(S==='cake'){
    if(k==='1'||k==='2'||k==='3') cake.frost = ['black','pink','crim'][+k-1];
    if(k==='4') cake.roses = !cake.roses;
    if(k==='5') cake.hearts = !cake.hearts;
    if(k==='6') cake.plush = !cake.plush;
    if(k==='l'||k==='enter') lightCandles();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k]=false; for(const k in vk) vk[k]=false; });
function held(name){
  if(vk[name]) return true;
  for(const k in KEYMAP) if(KEYMAP[k]===name && keys[k]) return true;
  return false;
}
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
if(isTouch) document.body.classList.add('touch');
document.querySelectorAll('.tb').forEach(el => {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); audioInit(); try{el.setPointerCapture(e.pointerId);}catch(_){}
    vk[k]=true; el.classList.add('on');
    if(S==='play'){ if(k==='jump') jumpBuf=.12; if(k==='flash') flashQ=true; } };
  const off = e => { e.preventDefault(); vk[k]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const flashBtn = document.getElementById('flashBtn');

let mouse = { x:-1, y:-1 };
function toLogical(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
const inR = (p,r) => p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h;
const MUTE_R = { x:228, y:254, w:24, h:14 };
cv.addEventListener('pointermove', e => { mouse = toLogical(e); });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const p = toLogical(e); mouse = p;

/* ---------- play logic ---------- */
function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
const pBox = () => ({x:P.x-4,y:P.y+2,w:8,h:18});
function cubeBox(c){ return {x:c.x-5,y:c.y-5,w:10,h:10}; }
function hazardsHit(box){
  for(const c of cubes) if(c.alive && rectHit(box,cubeBox(c))) return c;
  for(const s of SPIKES) if(rectHit(box,{x:s[0]+2,y:GROUND-10,w:s[1]-4,h:10})) return s;
  return null;
}
function supportBelow(x,bottom,exact){
  for(const s of SOLIDS){
    if(s.hidden && revealT<=0) continue;
    if(x>s.x+1 && x<s.x+s.w-1){
      if(exact ? Math.abs(s.y-bottom)<=2 : s.y>=bottom-2) return true;
    }
  }
  return false;
}
function safeSpot(nx,ny){
  if(nx<10) return false;
  const box = {x:nx-10,y:ny-6,w:20,h:32};
  if(hazardsHit(box)) return false;
  const bot = ny+P.h;
  return supportBelow(nx-4,bot,P.onGround) && supportBelow(nx+4,bot,P.onGround);
}
const LAG_MSGS = ['Teleported back to spawn...','Packet loss ate your input!','Rubber-band engaged. Classic.','Server tick said nope!'];
function startLag(){
  lag.active = 1.5; lagFx = 1.5; sfx.warn();
  const m = LAG_MSGS[(Math.random()*LAG_MSGS.length)|0];
  say(m,2.4);
  let moved = false;
  for(const d of [30,22,14,8]){
    if(safeSpot(P.x-d,P.y)){
      burst(P.x,P.y+10,12,[COL.red,COL.pink],70,.5,0);
      P.x -= d; P.vx = 0; moved = true;
      burst(P.x,P.y+10,12,[COL.red,COL.chrome],70,.5,0);
      break;
    }
  }
  if(moved) sfx.tele();
  if(m.startsWith('Packet') && P.onGround) inputLock = .5;
  P.inv = Math.max(P.inv,1.2);
}
function hurt(from){
  if(P.inv>0) return;
  hearts--; sfx.hurt();
  burst(P.x,P.y+10,14,[COL.red,COL.crim,COL.pink],110,.6,200);
  if(hearts<=0){ respawn('Re-queued at checkpoint!'); return; }
  P.inv = 1.5; P.hurtT = .25; P.vy = -230;
  P.vx = (P.x<from?-1:1)*150;
  say('Ouch! 999ms hit registration.',1.6);
}
function respawn(msg){
  hearts = 3; P.x = cpCur.x; P.y = GROUND-P.h; P.vx = P.vy = 0; P.inv = 2; P.onGround = false;
  camX = clamp(P.x-W*.4,0,LEVEL_W-W);
  sfx.respawn(); say(msg||'Respawned. Full health!',2.2);
  burst(P.x,P.y+10,16,[COL.pink,COL.chrome],80,.7,-20);
}
function doFlash(){
  if(flashCD>0){ sfx.deny(); return; }
  flashCD = 3; revealT = 5; ring = { t:0, r:0 }; sfx.flash();
  say('Initiator Recon Flash!',1.4);
}
function updatePlay(dt){
  T += 0; playT += dt;
  if(jumpBuf>0) jumpBuf -= dt;
  jumpHeld = held('jump');
  if(flashQ){ flashQ = false; doFlash(); }
  if(inputLock>0) inputLock -= dt;
  if(P.inv>0) P.inv -= dt;
  if(P.hurtT>0) P.hurtT -= dt;
  if(flashCD>0) flashCD = Math.max(0,flashCD-dt);
  if(revealT>0) revealT = Math.max(0,revealT-dt);
  if(status.t>0) status.t -= dt;
  if(P.flapT>0) P.flapT -= dt;

  /* lag spike */
  lag.t += dt;
  if(lag.active>0) lag.active -= dt;
  if(lagFx>0) lagFx -= dt;
  if(lag.t>=lag.next){ lag.t = 0; lag.next = rnd(11.5,12.5); startLag(); }
  const toLag = lag.next-lag.t;
  pingJit -= dt; if(pingJit<=0){ pingJit = .25; pingT = 184+rnd(-18,40); }
  if(lag.active>0) pingT = 999; else if(toLag<2) pingT = 600+rnd(-30,30); else if(toLag<4.5) pingT = 420+rnd(-20,20);
  ping += (pingT-ping)*Math.min(1,dt*(lag.active>0?14:5));

  /* physics (sub-stepped) */
  const n = Math.ceil(dt/(1/120)), h = dt/n;
  for(let i=0;i<n;i++) physics(h);

  /* sidekick */
  const tx = P.x-P.face*14, ty = P.y-6+Math.sin(playT*4)*3;
  bat.x += (tx-bat.x)*Math.min(1,dt*6); bat.y += (ty-bat.y)*Math.min(1,dt*6);
  bat.flap += dt*(P.flapT>0?30:8);

  /* collectibles */
  const pb = pBox();
  for(const it of items){
    if(it.got) continue;
    if(Math.hypot(it.x-P.x,it.y-(P.y+10))<13){
      it.got = true; collected++; score += POINTS[it.k];
      it.k==='orb' ? sfx.orb() : sfx.collect();
      burst(it.x,it.y,12,[COL.pink,COL.chrome,COL.crim],80,.6,0);
      say('+'+POINTS[it.k],1);
    }
  }
  /* cubes */
  for(const c of cubes){
    if(!c.alive) continue;
    c.ph += dt*c.sp;
    if(c.mode==='v'){ c.x = c.bx; c.y = c.by+Math.sin(c.ph*2)*c.amp; }
    else { c.x = c.bx+Math.sin(c.ph*2)*c.amp; c.y = c.by+Math.sin(c.ph*3)*3; }
  }
  /* flash ring */
  if(ring){
    ring.t += dt; ring.r = 110*(1-Math.pow(1-clamp(ring.t/.6,0,1),3));
    const cx = P.x, cy = P.y+10;
    for(const c of cubes) if(c.alive && Math.hypot(c.x-cx,c.y-cy)<=ring.r){
      c.alive = false; score += 50; sfx.stun();
      burst(c.x,c.y,18,[COL.red,COL.pink,COL.chrome,'#fff'],130,.6,80);
    }
    if(ring.t>.7) ring = null;
  }
  /* hazards */
  if(P.inv<=0){
    const hz = hazardsHit(pb);
    if(hz) hurt(Array.isArray(hz)?hz[0]+hz[1]/2:hz.x);
  }
  /* checkpoints */
  for(const cp of cps) if(!cp.got && P.x>cp.x){
    cp.got = true; cpCur = cp; sfx.check(); say('CHECKPOINT!',1.6);
    burst(cp.x,GROUND-24,14,[COL.pink,COL.chrome],70,.7,-10);
  }
  /* fall */
  if(P.y>H+30) respawn('Fell off. Free re-queue!');
  /* mirror */
  if(P.x>MIRROR_X-14 && P.x<MIRROR_X+14 && fade.dir===0){
    sfx.win(); say('Vanity Mirror reached!',2);
    goto(() => { S = 'cake'; stopTheme(); setMode('cozy'); parts = []; cake.lit = false; });
  }
  /* camera */
  const tcx = clamp(P.x-W*.4+P.face*30,0,LEVEL_W-W);
  camX += (tcx-camX)*Math.min(1,dt*5);
  updateParts(dt,playT);
}
function physics(dt){
  const dir = (inputLock>0||P.hurtT>0) ? 0 : (held('right')?1:0)-(held('left')?1:0);
  if(P.hurtT<=0){
    const target = dir*135;
    P.vx = approach(P.vx,target,(dir?(P.onGround?1500:900):(P.onGround?1800:400))*dt);
  }
  if(dir) P.face = dir;
  if(P.onGround){ P.coyote = .1; P.canDouble = true; } else P.coyote -= dt;
  if(jumpBuf>0 && inputLock<=0){
    if(P.coyote>0){ P.vy = -440; P.coyote = 0; jumpBuf = 0; sfx.jump(); burst(P.x,P.y+20,5,[COL.pink,COL.chrome],40,.3,0); P.onGround = false; }
    else if(P.canDouble){ P.vy = -380; P.canDouble = false; jumpBuf = 0; P.flapT = .35; sfx.djump(); burst(P.x,P.y+18,8,[COL.pink,'#fff'],60,.4,0); }
  }
  if(!jumpHeld && P.vy<-150) P.vy = -150;
  P.vy = Math.min(P.vy+1300*dt,460);
  P.x = clamp(P.x+P.vx*dt,6,LEVEL_W-6);
  const prevBot = P.y+P.h;
  P.y += P.vy*dt;
  P.onGround = false;
  if(P.vy>=0){
    const bot = P.y+P.h;
    for(const s of SOLIDS){
      if(s.hidden && revealT<=0) continue;
      if(P.x+4>s.x && P.x-4<s.x+s.w && prevBot<=s.y+.5 && bot>=s.y){
        P.y = s.y-P.h; P.vy = 0; P.onGround = true; break;
      }
    }
  }
  if(P.onGround && Math.abs(P.vx)>20) P.anim += dt*10; else if(!P.onGround) P.anim = 0;
}

  ctx.drawImage(scan,0,0); ctx.drawImage(vig,0,0);
  drawMute();
  if(fade.a>0){ ctx.globalAlpha = fade.a; ctx.fillStyle = COL.bg; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; }
}
requestAnimationFrame(frame);
})();
</script>
